# Ingress front for Nutify: the app only works from the root of its own host,
# so rewrite absolute paths to the Home Assistant ingress prefix on the fly.
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx-ingress.pid;
events { worker_connections 256; }
http {
  access_log off;
  client_max_body_size 64m;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  # Prefix: header set by the Supervisor (no test prefix needed in production).
  map $http_x_ingress_path $ingress_path { default $http_x_ingress_path; }
  server {
    listen 8099;
    absolute_redirect off;
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;
    location / {
      proxy_pass http://127.0.0.1:5050;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:5050;
      proxy_set_header Origin http://127.0.0.1:5050;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 3600s;
      proxy_redirect ~^https?://127\.0\.0\.1:5050(?<rp>/.*)$ $ingress_path$rp;
      proxy_redirect ~^(?<rp>/.*)$ $ingress_path$rp;
      proxy_cookie_path / $ingress_path/;
      sub_filter_once off;
      sub_filter_types text/css application/javascript text/javascript;
      sub_filter '<head>' '<head><script>(function(){var m=location.pathname.match(/^\/api\/hassio_ingress\/[^\/]+/);if(!m)return;var P=m[0];window.__INGRESS_PATH=P;function fx(u){if(typeof u!=="string")return u;if(u.charAt(0)==="/"&&u.charAt(1)!=="/"){return(u===P||u.indexOf(P+"/")===0)?u:P+u}try{var x=new URL(u,location.href);if(x.host===location.host&&x.pathname.indexOf(P)!==0){x.pathname=P+x.pathname;return x.href}}catch(e){}return u}var f=window.fetch;window.fetch=function(a,b){if(typeof a==="string")a=fx(a);else if(a&&a.url)a=new Request(fx(a.url),a);return f.call(this,a,b)};var o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(){arguments[1]=fx(String(arguments[1]));return o.apply(this,arguments)};var W=window.WebSocket;var W2=function(u,p){return p?new W(fx(u),p):new W(fx(u))};W2.prototype=W.prototype;["CONNECTING","OPEN","CLOSING","CLOSED"].forEach(function(k){W2[k]=W[k]});window.WebSocket=W2;if(window.EventSource){var E=window.EventSource;var E2=function(u,c){return new E(fx(u),c)};E2.prototype=E.prototype;window.EventSource=E2}function fa(a){var h=a.getAttribute("href");if(h&&h.charAt(0)==="/"&&h.charAt(1)!=="/"&&h!==P&&h.indexOf(P+"/")!==0)a.setAttribute("href",P+h)}function sc(n){if(n.nodeType!==1)return;if(n.tagName==="A")fa(n);var l=n.querySelectorAll?n.querySelectorAll("a[href]"):[];for(var i=0;i<l.length;i++)fa(l[i])}new MutationObserver(function(ms){ms.forEach(function(r){if(r.type==="attributes")sc(r.target);else r.addedNodes.forEach(sc)})}).observe(document,{childList:true,subtree:true,attributes:true,attributeFilter:["href"]});var s=location.pathname.slice(P.length)||"/";history.replaceState(history.state,"",s+location.search+location.hash)})();</script>';
      sub_filter '"/frontend-dist' '"$ingress_path/frontend-dist';
      sub_filter '"/socket.io' '"$ingress_path/socket.io';
      sub_filter "'/frontend-dist" "'$ingress_path/frontend-dist";
      sub_filter "'/socket.io" "'$ingress_path/socket.io";
      sub_filter '`/frontend-dist' '`$ingress_path/frontend-dist';
      sub_filter '`/socket.io' '`$ingress_path/socket.io';
      sub_filter 'url(/frontend-dist' 'url($ingress_path/frontend-dist';
      sub_filter 'url("/frontend-dist' 'url("$ingress_path/frontend-dist';
      sub_filter "url('/frontend-dist" "url('$ingress_path/frontend-dist";
      sub_filter 'location.href="/' 'location.href="$ingress_path/';
      sub_filter 'location.href=`/' 'location.href=`$ingress_path/';
      sub_filter "location.href='/" "location.href='$ingress_path/";
      sub_filter 'location.replace("/' 'location.replace("$ingress_path/';
      sub_filter 'location.replace(`/' 'location.replace(`$ingress_path/';
      sub_filter 'location.assign("/' 'location.assign("$ingress_path/';
      sub_filter 'href:"/' 'href:"$ingress_path/';
      sub_filter 'href:`/' 'href:`$ingress_path/';
      sub_filter 'window.open("/' 'window.open("$ingress_path/';
      sub_filter 'window.open(`/' 'window.open(`$ingress_path/';
    }
  }
}
