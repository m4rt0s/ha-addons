name: "PyPowerwall Server"
version: "0.11.2"
slug: "pypowerwall_server"
description: "PyPowerwall Server (jasonacox) - local Tesla Powerwall gateway monitoring, console and MQTT"
url: "https://github.com/jasonacox/pypowerwall-server"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  8675/tcp: 8677
ports_description:
  8675/tcp: "Web console and API"
ingress: true
ingress_port: 8675
ingress_entry: console
panel_icon: "mdi:solar-power"
panel_title: "Powerwall"
webui: "http://[HOST]:[PORT:8675]/console"
watchdog: "http://[HOST]:[PORT:8675]/health"
options:
  pw_host: "192.168.91.1"
  pw_gw_pwd: ""
  timezone: "Europe/Madrid"
  gateway_name: "Powerwall"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_ha_discovery: true
  cache_expire: 5
  timeout: 10
  cache_ttl: 30
  graceful_degradation: true
  tedapi_recovery: true
  tedapi_probe_interval: 30
  style: "clear"
  neg_solar: false
  timeseries_retention: "24h"
  timeseries_daily_retention: "0"
  timeseries_signal_retention: "30d"
  timeseries_signal_interval: "60s"
  mqtt_topic_prefix: "pypowerwall"
  mqtt_ha_prefix: "homeassistant"
  mqtt_retain: true
  mqtt_qos: 1
  mqtt_keepalive: 60
  mqtt_client_id: "pypowerwall-server"
  mqtt_tls: false
  mqtt_controls: 0
  control_secret: ""
  health_check: true
  fail_fast: false
  suppress_network_errors: false
  cors_origins: ""
  rate_limit_enabled: false
  rate_limit_max_requests: 1000
  rate_limit_window_seconds: 60
  rate_limit_max_buckets: 10000
  debug: false
schema:
  pw_host: str
  pw_gw_pwd: password
  timezone: str
  gateway_name: str?
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_ha_discovery: bool
  cache_expire: int(1,300)?
  timeout: int(1,120)?
  cache_ttl: int(1,3600)?
  graceful_degradation: bool?
  tedapi_recovery: bool?
  tedapi_probe_interval: int(5,3600)?
  style: list(clear|black|white|grafana|grafana-dark)?
  neg_solar: bool?
  timeseries_retention: str?
  timeseries_daily_retention: str?
  timeseries_signal_retention: str?
  timeseries_signal_interval: str?
  mqtt_topic_prefix: str?
  mqtt_ha_prefix: str?
  mqtt_retain: bool?
  mqtt_qos: int(0,2)?
  mqtt_keepalive: int(10,600)?
  mqtt_client_id: str?
  mqtt_tls: bool?
  mqtt_controls: int(0,31)?
  control_secret: password?
  health_check: bool?
  fail_fast: bool?
  suppress_network_errors: bool?
  cors_origins: str?
  rate_limit_enabled: bool?
  rate_limit_max_requests: int(1,100000)?
  rate_limit_window_seconds: int(1,3600)?
  rate_limit_max_buckets: int(100,1000000)?
  debug: bool?
