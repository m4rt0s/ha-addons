name: "Nutify"
version: "0.4.0"
slug: "nutify"
description: "Monitorización web de SAI/UPS con gráficas en tiempo real, alertas e informes, sobre Network UPS Tools. · Web UPS monitoring with real-time charts, alerts and reports, built on Network UPS Tools."
url: "https://github.com/DartSteven/Nutify"
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  5050/tcp: 5050
ports_description:
  5050/tcp: "Direct web interface (optional, the sidebar uses Ingress)"
ingress: true
ingress_port: 8099
panel_icon: "mdi:battery-heart-variant"
panel_title: "Nutify"
options:
  timezone: "Europe/Madrid"
  log_level: "INFO"
  secret_key: ""
  socketio_allowed_origins: ""
schema:
  timezone: str
  log_level: list(DEBUG|INFO|WARNING|ERROR|CRITICAL)
  secret_key: password?
  socketio_allowed_origins: str?
